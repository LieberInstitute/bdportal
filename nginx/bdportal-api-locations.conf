# bdportal middleware API proxy locations.
# Include these before the static /bdportal/, /dev/*, and /devel/* app locations.
# /bdportal and /devel use the production middleware (bdportal-server.service, 4095);
# /dev/bdportal uses the dev instance (bdportal-server-dev.service, 4097).

location ^~ /bdportal/api/ {
    proxy_pass http://127.0.0.1:4095/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /dev/bdportal/api/ {
    proxy_pass http://127.0.0.1:4097/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /devel/bdportal/api/ {
    proxy_pass http://127.0.0.1:4095/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
